# Climate history, every five minutes, for free.
#
# Vercel's Hobby plan allows one cron run per day, which is useless for a chart.
# GitHub Actions schedules are free, so the five-minute job lives here and
# simply calls the same endpoint.
#
# SET THESE FIRST — repo → Settings → Secrets and variables → Actions:
#   APP_URL    https://your-app.vercel.app
#   SYNC_KEY   the same value you put in Vercel's environment variables
#
# Without both, this workflow skips rather than failing every five minutes.
name: Sync sensor readings

on:
  schedule:
    # GitHub queues scheduled runs, so expect drift of a few minutes under load.
    - cron: "*/5 * * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

concurrency:
  group: sync-readings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$SYNC_KEY" ]; then
            echo "APP_URL or SYNC_KEY is not set — skipping."
            echo "Add them under Settings → Secrets and variables → Actions."
            exit 0
          fi

          response=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --retry 2 --retry-delay 5 \
            -X POST "$APP_URL/api/sync-readings" \
            -H "x-sync-key: $SYNC_KEY")

          echo "$response"
